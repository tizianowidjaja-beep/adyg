<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedOut Simulator - Game Nyari Kerja Miris</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f4f8; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        
        /* Frame HP - Tema Putih Bersih */
        .phone { width: 100%; max-width: 380px; height: 680px; border: 12px solid #cbd5e1; border-radius: 40px; background: #ffffff; color: #1e293b; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .notch { width: 120px; height: 20px; background: #cbd5e1; position: absolute; top: 0; left: 50%; transform: translateX(-50%); border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; z-index: 10; }
        
        /* Header Aplikasi - Biru Muda Cerah */
        .header { background: #38bdf8; color: white; padding: 25px 15px 15px 15px; text-align: center; font-weight: bold; font-size: 20px; letter-spacing: 0.5px; }
        
        /* Status Bar */
        .stats-bar { display: flex; justify-content: space-between; background: #f0fdf4; padding: 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .stat-box { background: white; padding: 5px 12px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .danger { color: #ef4444; }
        
        /* Konten */
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; background: #f8fafc; }
        .job-card { background: white; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); text-align: center; margin-bottom: 15px; }
        .company { font-size: 11px; color: #0284c7; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; letter-spacing: 0.5px; }
        .title { font-size: 18px; color: #0f172a; font-weight: 700; margin-bottom: 10px; }
        .salary { font-size: 16px; color: #16a34a; font-weight: 600; margin-bottom: 10px; }
        .desc { font-size: 13px; color: #64748b; line-height: 1.5; min-height: 60px; display: flex; align-items: center; justify-content: center; }
        
        /* Tombol - Biru Muda Dominan */
        .actions { display: flex; flex-direction: column; gap: 10px; }
        .btn { width: 100%; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .btn-primary { background: #0ea5e9; color: white; box-shadow: 0 4px 6px rgba(14, 165, 233, 0.2); }
        .btn-primary:hover { background: #0284c7; }
        .btn-secondary { background: #e2e8f0; color: #64748b; }
        .btn-secondary:hover { background: #cbd5e1; color: #334155; }
        
        /* Modals */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal-content { background: white; color: #1e293b; padding: 25px; border-radius: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); width: 100%; border: 1px solid #e2e8f0; }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        
        /* Progress Bar Minigame */
        .progress-container { background: #e2e8f0; border-radius: 10px; height: 18px; width: 100%; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: #38bdf8; height: 100%; width: 0%; transition: width 0.1s; }
        
        @media (max-height: 700px) { .phone { height: 100vh; border: none; border-radius: 0; } .notch { display: none; } }
    </style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="header">LinkedOut 📱</div>
    
    <div class="stats-bar">
        <div class="stat-box">📅 Hari <span id="day" style="color:#0ea5e9;">1</span></div>
        <div class="stat-box">💰 Rp <span id="money" style="color:#16a34a;">1.000.000</span></div>
        <div class="stat-box">🤯 Stres <span id="stress" class="danger">0</span>/100</div>
    </div>

    <div class="content">
        <div class="job-card">
            <div class="company" id="job-company">MEMUAT...</div>
            <h3 class="title" id="job-title">Mencari Lowongan</h3>
            <div class="salary">Gaji: Rp <span id="job-salary">0</span></div>
            <p class="desc" id="job-desc">Silakan tunggu sebentar...</p>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="mulaiMinigame()">Lamar Pekerjaan & Mulai Kerja</button>
            <button class="btn btn-secondary" onclick="skipDay()">Tolak & Cari yang Lain (-Rp50rb)</button>
        </div>
    </div>
    
    <!-- Pop-up Minigame -->
    <div id="game-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" style="color: #0ea5e9;">💻 LEMBUR TIME!</h3>
            <p id="game-instruction" style="font-size: 14px; margin-bottom: 10px; color:#64748b;"></p>
            <div style="font-size: 18px; font-weight: bold; color: #ef4444;">⏱️ Sisa Waktu: <span id="game-timer">5</span>s</div>
            
            <div class="progress-container">
                <div id="game-progress" class="progress-bar"></div>
            </div>
            
            <button id="tap-btn" class="btn btn-primary" style="background:#22c55e; padding: 18px 0; font-size: 16px; box-shadow: none;" onclick="hitungTap()">KLIK UNTUK KERJA! (0/10)</button>
        </div>
    </div>

    <!-- Pop-up Pajak -->
    <div id="tax-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" style="color:#ef4444;">🚨 PAJAK DAHSYAT!</h3>
            <p style="margin-bottom: 15px; font-size: 14px; color:#64748b;">Sudah hari ke-<span id="tax-day">3</span>. Pemerintah mendeteksi uangmu. Kamu dipotong pajak sebesar 47%!</p>
            <h2 style="color: #ef4444; margin-bottom: 20px;">-Rp <span id="tax-amount">0</span></h2>
            <button class="btn btn-primary" style="background:#ef4444;" onclick="closeTaxModal()">Bayar dengan Terpaksa</button>
        </div>
    </div>

    <!-- Pop-up Game Over -->
    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <h3 class="modal-title" style="color: white; background: #ef4444; padding: 8px; border-radius: 12px;">💀 GAME OVER</h3>
            <div id="gameover-reason" style="margin-bottom: 20px; font-size: 14px; color:#64748b; margin-top: 15px;"></div>
            <button class="btn btn-primary" onclick="resetGame()">Coba Cari Kerja Lagi</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
